<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rừng Săn Lỗi</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #dcfce7; --bg-panel: #ffffff; --primary: #10b981; --error: #ef4444; --warning: #f59e0b; --text-main: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Nunito', sans-serif;}
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .game-container { width: 100%; max-width: 800px; background: var(--bg-panel); border: 5px solid var(--primary); border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        .screen { display: none; padding: 40px; text-align: center;} .screen.active { display: block; animation: fadeIn 0.4s ease; }
        .title-kid { font-size: 3.5rem; color: var(--primary); font-family: 'Baloo 2', cursive; margin-bottom: 10px; text-shadow: 2px 2px 0 #a7f3d0;}
        .btn { padding: 15px 35px; background: var(--primary); color: #fff; font-size: 1.2rem; font-family: 'Baloo 2', cursive; cursor: pointer; border-radius: 25px; border: none; box-shadow: 0 6px 0 #059669;}
        .btn:active { transform: translateY(6px); box-shadow: none; }
        .btn-outline { background: #f1f5f9; border: 3px solid #cbd5e1; color: #475569; box-shadow: 0 5px 0 #cbd5e1; margin-left: 10px;}
        .hud { display: flex; justify-content: space-between; background: #f0fdfa; padding: 15px 25px; border-radius: 20px; margin-bottom: 20px; font-weight: 800; font-size: 1.3rem; font-family: 'Baloo 2', cursive; color: #0f766e; border: 3px dashed var(--primary);}
        .situation-board { background: #f8fafc; border: 3px solid #cbd5e1; border-radius: 20px; padding: 25px; text-align: left; font-size: 1.2rem;}
        .option-line { padding: 15px 20px; margin-bottom: 15px; background: white; border: 3px solid #e2e8f0; border-radius: 15px; cursor: pointer; transition: 0.2s; font-weight: 700; box-shadow: 0 4px 0 #e2e8f0;}
        .option-line:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 7px 0 var(--primary);}
        .option-line.error-reveal { background: #fee2e2; border-color: var(--error); box-shadow: 0 4px 0 var(--error); animation: shake 0.4s; }
        .option-line.correct-reveal { background: #d1fae5; border-color: var(--primary); box-shadow: 0 4px 0 var(--primary); color: var(--primary);}
        
        .feedback-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .feedback-modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .feedback-box { background: #fff; padding: 30px; border-radius: 25px; text-align: center; max-width: 450px; width: 90%; border: 5px solid #ef4444; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .fb-title { font-family: 'Baloo 2', cursive; font-size: 2rem; margin-bottom: 15px; }
        .fb-exp { font-size: 1.1rem; color: #334155; line-height: 1.5; margin-bottom: 20px; font-weight: 700;}
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px);} to { opacity: 1; transform: translateY(0);} } 
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="screen-home" class="screen active">
            <h1 class="title-kid">🐞 RỪNG SĂN LỖI</h1>
            <p style="font-size: 1.3rem; margin-bottom: 30px; font-weight: 700; color: #64748b;">Hãy đọc kỹ tình huống và tìm ra hành động <b>SAI</b> (Lỗi) nhé!</p>
            <div><button class="btn" onclick="initGame()">ĐI SĂN LỖI NÀO!</button><button class="btn btn-outline" onclick="window.location.href='index.html#games'">VỀ BẢN ĐỒ</button></div>
        </div>
        
        <div id="screen-game" class="screen">
            <div style="text-align: left; margin-bottom: 15px;"><button class="btn btn-outline" style="padding: 8px 15px; font-size: 1rem; border-width: 2px; margin-left:0;" onclick="window.location.href='index.html#games'">← QUAY VỀ BẢN ĐỒ</button></div>
            <div class="hud"><div>Mạng: <span id="ui-lives" style="color:var(--error)">❤️❤️❤️</span></div><div>Điểm XP: <span id="ui-score" style="color:var(--primary)">0</span></div></div>
            <h3 id="q-title" style="margin-bottom: 20px; color: #0284c7; font-family: 'Baloo 2', cursive; font-size: 1.8rem;">Tình huống...</h3>
            <div class="situation-board" id="code-board"></div>
        </div>
        
        <div id="screen-result" class="screen">
            <h1 class="title-kid" id="res-title">HOÀN THÀNH!</h1>
            <p style="font-size: 1.4rem; font-weight: 800; margin-bottom: 30px;">Thu hoạch: <span id="res-score" style="color: var(--warning); font-size: 2.5rem; font-family: 'Baloo 2', cursive;">0</span> XP</p>
            <div><button class="btn" style="background:var(--warning); box-shadow:0 6px 0 #d97706;" onclick="initGame()">CHƠI LẠI</button><button class="btn btn-outline" onclick="saveAndGoHome()">THU THẬP & THOÁT</button></div>
        </div>
    </div>
    
    <div class="feedback-modal" id="fb-modal">
        <div class="feedback-box" id="fb-box">
            <h2 class="fb-title" id="fb-title">Tuyệt vời!</h2>
            <div class="fb-exp" id="fb-exp">Giải thích</div>
            <button class="btn" id="fb-btn" style="width: 100%; margin: 0;" onclick="closeFeedback()">TIẾP TỤC</button>
        </div>
    </div>
    
    <script>
const bugs = [
    { title: "Tình huống: Sắp xếp dữ liệu cá nhân", lines: ["1. Tạo thư mục riêng để lưu bài tập.", "2. Sao chép bài tập ra 100 thư mục khác nhau.", "3. Đặt tên thư mục là tên của em."], bugLine: 1, exp: "Sao chép ra quá nhiều nơi sẽ làm tốn bộ nhớ và khiến em rất khó tìm lại bài khi cần!", wrongExp: "Đây là thao tác rất TỐT giúp máy tính gọn gàng. Hãy tìm hành động sai cơ!" },
    { title: "Tình huống: Dọn dẹp máy tính", lines: ["1. Xoá tệp bài làm cũ do chính em tạo ra.", "2. Xoá tệp lạ trong thư mục Windows.", "3. Gom các ảnh vào chung thư mục Hinh anh."], bugLine: 1, exp: "Thư mục Windows chứa các tệp hệ thống. Xoá nhầm sẽ làm lỗi chương trình, treo máy tính!", wrongExp: "Hành động này hoàn toàn đúng vì em có quyền xoá tệp do mình tạo ra." },
    { title: "Tình huống: Dùng máy tính chung ở trường", lines: ["1. Di chuyển thư mục của bạn khác vào thùng rác.", "2. Tạo thư mục mang tên nhóm mình.", "3. Lưu bài trình chiếu vào đúng thư mục nhóm."], bugLine: 0, exp: "Xoá hoặc di chuyển thư mục của bạn khác sẽ làm mất bài tập của bạn, gây đảo lộn trật tự!", wrongExp: "Đây là việc nên làm để giữ gìn máy tính chung gọn gàng." },
    { title: "Tình huống: Sao chép dữ liệu", lines: ["1. Dùng lệnh Copy để lưu thêm một bản dự phòng.", "2. Copy thư mục bài tập của mình sang ổ đĩa D.", "3. Sao chép tệp bài làm của bạn khác thành của mình."], bugLine: 2, exp: "Sao chép bài của bạn thành của mình là không trung thực trong học tập nhé!", wrongExp: "Việc sao chép để dự phòng (backup) là một thói quen cực kỳ an toàn." },
    { title: "Tình huống: Tìm kiếm thông tin", lines: ["1. Gõ từ khoá thật dài không rõ nghĩa.", "2. Gõ từ khoá ngắn gọn, đúng trọng tâm.", "3. Kiểm tra kĩ từ khoá trước khi nhấn Enter."], bugLine: 0, exp: "Từ khoá quá dài và lan man sẽ làm máy tìm kiếm không hiểu được em thực sự muốn tìm gì.", wrongExp: "Đây là thao tác chuẩn xác để tìm được thông tin nhanh nhất." },
    { title: "Tình huống: Đọc kết quả tìm kiếm", lines: ["1. Xem lướt các dòng tóm tắt bên dưới link.", "2. Nhấp chuột bừa bãi vào mọi siêu liên kết.", "3. Chọn siêu liên kết từ trang web uy tín."], bugLine: 1, exp: "Nhấp bừa bãi có thể đưa em vào các trang web chứa mã độc hoặc thông tin không phù hợp.", wrongExp: "Đọc tóm tắt là cách thông minh để biết trang web đó có chứa thứ mình cần không." },
    { title: "Tình huống: Đổi tên thư mục", lines: ["1. Đổi tên thư mục Bài tập thành Bai tap Tin hoc.", "2. Đổi tên thư mục chứa trò chơi của anh trai.", "3. Đổi tên tệp văn bản của em cho dễ nhớ."], bugLine: 1, exp: "Đổi tên thư mục của người khác sẽ làm họ không tìm thấy dữ liệu của mình nữa.", wrongExp: "Tự sắp xếp và đổi tên dữ liệu của bản thân là điều rất đáng khen!" },
    { title: "Tình huống: Di chuyển thư mục", lines: ["1. Chọn lệnh Move to để chuyển tệp.", "2. Kéo thả tệp hệ thống ra ngoài màn hình nền.", "3. Chuyển thư mục con vào đúng thư mục mẹ."], bugLine: 1, exp: "Tệp hệ thống cần nằm đúng chỗ của nó. Kéo ra ngoài sẽ làm máy tính báo lỗi ngay!", wrongExp: "Lệnh Move to sinh ra chính là để di chuyển dữ liệu gọn gàng hơn." },
    { title: "Tình huống: Nhập địa chỉ web", lines: ["1. Gõ google.com vào thanh tìm kiếm.", "2. Nhấn Enter sau khi gõ xong địa chỉ.", "3. Gõ mật khẩu của em vào thanh địa chỉ."], bugLine: 2, exp: "Thanh địa chỉ chỉ dùng để gõ tên trang web (như google.com). Không bao giờ gõ mật khẩu lên đó!", wrongExp: "Thao tác này hoàn toàn đúng để truy cập vào trang web." },
    { title: "Tình huống: Dùng chuột để Copy/Move", lines: ["1. Nháy nút phải chuột để hiện bảng lệnh.", "2. Chọn Copy rồi chọn Delete để dán.", "3. Chọn Copy rồi chọn Paste để dán tệp."], bugLine: 1, exp: "Lệnh Delete là để xoá! Muốn dán tệp vừa copy, em phải dùng lệnh Paste.", wrongExp: "Nháy nút phải chuột là cách rất nhanh để gọi bảng lệnh thao tác." }
];        let queue = [], lives = 3, score = 0, currentBug = null, isProcessing = false, onFeedbackClose = null;

        function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function initGame() { queue = [...bugs].sort(() => Math.random() - 0.5); lives = 3; score = 0; updateHUD(); showScreen('screen-game'); loadCode(); }
        function updateHUD() { document.getElementById('ui-score').innerText = score; document.getElementById('ui-lives').innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives); }
        
        function loadCode() {
            if (queue.length === 0 || lives <= 0) return endGame();
            isProcessing = false; currentBug = queue.shift(); document.getElementById('q-title').innerText = currentBug.title;
            let html = ''; currentBug.lines.forEach((line, i) => { html += `<div class="option-line" id="line-${i}" onclick="checkLine(${i})">${line}</div>`; });
            document.getElementById('code-board').innerHTML = html;
        }

        function checkLine(i) {
            if (isProcessing) return; let el = document.getElementById(`line-${i}`); isProcessing = true;
            if (i === currentBug.bugLine) {
                el.classList.add('correct-reveal'); score += 100; updateHUD();
                showModal(true, "BẮT ĐÚNG LỖI! 🎉", currentBug.exp, () => loadCode());
            } else {
                el.classList.add('error-reveal'); lives--; updateHUD();
                if (lives <= 0) { showModal(false, "HẾT MẠNG! 😢", "Em đã chọn nhầm quá nhiều lần. Nhớ cẩn thận hơn vào lần sau nhé!", () => endGame()); } 
                else { showModal(false, "Nhầm rồi em ơi!", currentBug.wrongExp, () => { el.classList.remove('error-reveal'); isProcessing = false; queue.unshift(currentBug); loadCode(); }); }
            }
        }

        function showModal(isSuccess, title, desc, callback) {
            document.getElementById('fb-title').innerText = title; 
            document.getElementById('fb-title').style.color = isSuccess ? "#10b981" : "#ef4444";
            document.getElementById('fb-box').style.borderColor = isSuccess ? "#10b981" : "#ef4444";
            document.getElementById('fb-btn').style.background = isSuccess ? "#10b981" : "#ef4444";
            document.getElementById('fb-exp').innerText = desc;
            document.getElementById('fb-modal').classList.add('active');
            onFeedbackClose = callback;
        }

        function closeFeedback() { document.getElementById('fb-modal').classList.remove('active'); if(onFeedbackClose) onFeedbackClose(); }
        
        function endGame() {
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-title').innerText = lives > 0 ? "BẮT LỖI THÀNH CÔNG! 🏆" : "KẾT THÚC";
            document.getElementById('res-title').style.color = lives > 0 ? "var(--primary)" : "var(--error)"; showScreen('screen-result');
        }

        function saveAndGoHome() { 
            let user = JSON.parse(localStorage.getItem('edtech_user_kid')) || {}; 
            let currentScore = 0;
            if (typeof score !== 'undefined') currentScore = score; 
            else if (typeof state !== 'undefined' && typeof state.score !== 'undefined') currentScore = state.score; 
            if (typeof bossHP !== 'undefined') currentScore = (bossHP <= 0) ? 250 : 50;

            user.xp = (user.xp || 0) + currentScore; 
            user.level = Math.floor(user.xp / 500) + 1; 
            user.last_played = new Date().toLocaleString('vi-VN');
            
            localStorage.setItem('edtech_user_kid', JSON.stringify(user)); 
            
            let leaderboard = JSON.parse(localStorage.getItem('edtech_leaderboard')) || [];
            let existingStudent = leaderboard.findIndex(s => s.id === user.id);
            if(existingStudent !== -1) { leaderboard[existingStudent] = user; } 
            else { leaderboard.push(user); }
            localStorage.setItem('edtech_leaderboard', JSON.stringify(leaderboard));

            window.location.href = 'index.html#games'; 
        }
    </script>
</body>
</html>
