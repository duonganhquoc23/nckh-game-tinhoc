<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ếch Con Qua Sông</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #dcfce7; --primary: #16a34a; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --river: #0284c7;}
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Nunito', sans-serif;}
        body { background-color: var(--bg-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
        
        .game-container { width: 100%; max-width: 900px; background: #ffffff; border: 4px solid var(--primary); border-radius: 30px; position: relative; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .screen { display: none; padding: 40px; text-align: center; } .screen.active { display: block; animation: fadeIn 0.4s ease; }
        .title-kid { font-family: 'Baloo 2', cursive; font-size: 3.5rem; color: var(--primary); margin-bottom: 10px; text-shadow: 2px 2px 0 #bbf7d0;}
        .btn { padding: 15px 35px; background: var(--warning); color: white; font-size: 1.2rem; font-weight: 800; border-radius: 25px; cursor: pointer; box-shadow: 0 6px 0 #d97706; margin: 10px; border: none; font-family: 'Baloo 2', cursive;}
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
        .btn-outline { background: #f1f5f9; border: 3px solid #cbd5e1; color: #475569; box-shadow: 0 5px 0 #cbd5e1; }
        
        .hud { display: flex; justify-content: space-between; background: #f0fdf4; padding: 15px 30px; font-size: 1.4rem; font-weight: 800; color: var(--primary); border-bottom: 4px dashed #bbf7d0; font-family: 'Baloo 2', cursive; z-index: 50; position: relative;}
        .q-box { background: #fff; padding: 20px; font-size: 1.4rem; font-weight: 800; color: #334155; border-bottom: 4px solid var(--river); z-index: 50; min-height: 90px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.1);}
        
        .viewport { height: 400px; position: relative; background: var(--river); background-image: radial-gradient(#38bdf8 20%, transparent 20%); background-size: 40px 40px; overflow: hidden; }
        .river-scroll { position: absolute; bottom: 0; left: 0; width: 100%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; justify-content: flex-end;}
        
        .row-pads { display: flex; width: 100%; justify-content: space-around; padding: 20px; height: 160px; align-items: center;}
        .lily-pad { width: 40%; max-width: 200px; background: #4ade80; border: 4px solid #166534; border-radius: 50% 50% 40% 60%; min-height: 100px; display: flex; justify-content: center; align-items: center; padding: 15px; font-size: 1.2rem; font-weight: 800; color: #064e3b; cursor: pointer; box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 0 10px 0 #14532d; transition: 0.2s; position: relative; text-align: center;}
        .lily-pad:hover { transform: scale(1.05); }
        .lily-pad.disabled { pointer-events: none; opacity: 0.6; }
        
        /* FIX HOÀN TOÀN TỌA ĐỘ CON ẾCH */
        .frog { font-size: 4.5rem; position: absolute; z-index: 10; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); filter: drop-shadow(0 10px 5px rgba(0,0,0,0.4)); }
        
        .splash-anim { animation: splash 0.6s forwards; }
        @keyframes splash {
            0% { transform: scale(1); }
            50% { transform: translateY(30px) scale(0.8) rotate(20deg); filter: grayscale(1); opacity: 0.5;}
            100% { transform: translateY(80px) scale(0.3); opacity: 0; }
        }

        .feedback-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .feedback-modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .feedback-box { background: #fff; padding: 30px; border-radius: 25px; text-align: center; max-width: 450px; width: 90%; border: 5px solid #ef4444; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        @keyframes fadeIn { from { opacity:0; transform: translateY(15px); } to { opacity:1; transform: translateY(0); } } 
    </style>
</head>
<body>
    <div class="game-container">
        <div id="screen-home" class="screen active">
            <h1 class="title-kid">🐸 ẾCH CON QUA SÔNG</h1>
            <p style="font-size:1.3rem; margin-bottom:30px; font-weight:700;">Em hãy chọn lá sen chứa đáp án <b>ĐÚNG</b> để giúp ếch nhảy qua sông. Đoạn sông này có 10 bước nhảy đấy!</p>
            <div>
                <button class="btn" onclick="initGame()">BẮT ĐẦU NHẢY</button>
                <button class="btn btn-outline" onclick="window.location.href='index.html#home'">VỀ BẢN ĐỒ</button>
            </div>
        </div>
        
        <div id="screen-game" class="screen" style="padding: 0;">
            <div style="width: 100%; text-align: left; padding: 10px 30px; background: #f0fdf4; border-bottom: 2px solid #bbf7d0; z-index: 50; position: relative;"><button class="btn btn-outline" style="padding: 5px 15px; font-size: 1rem; border-width: 2px; margin: 0; background: white;" onclick="window.location.href='index.html#home'">← QUAY VỀ</button></div>
            <div class="hud">
                <div>Bước nhảy: <span id="ui-prog" style="color: var(--warning);">1/10</span></div>
                <div>XP: <span id="ui-score" style="color: var(--success);">0</span></div>
            </div>
            <div class="q-box" id="ui-q">Câu hỏi...</div>
            
            <div class="viewport" id="viewport">
                <div class="river-scroll" id="river"></div>
            </div>
        </div>
        
        <div id="screen-result" class="screen">
            <h1 class="title-kid" style="color: var(--success);">QUA SÔNG THÀNH CÔNG!</h1>
            <div style="font-size: 1.5rem; font-weight: 800; margin-bottom: 30px;">Thu thập được: <span id="res-score" style="color: var(--warning); font-size: 2.5rem; font-family: 'Baloo 2', cursive;">0</span> XP</div>
            <div>
                <button class="btn" style="background:var(--primary);" onclick="initGame()">CHƠI LẠI</button>
                <button class="btn btn-outline" onclick="saveAndGoHome()">THOÁT</button>
            </div>
        </div>
    </div>

    <!-- MODAL HIỂN THỊ LỖI SAI -->
    <div class="feedback-modal" id="fb-modal">
        <div class="feedback-box">
            <h2 style="font-family: 'Baloo 2', cursive; font-size: 2rem; color: #ef4444; margin-bottom: 10px;">Rơi tõm xuống nước! 💦</h2>
            <div style="color: #ef4444; font-size: 1.2rem; font-weight: bold; text-decoration: line-through; margin-bottom: 5px;" id="fb-wrong">Lá sen em chọn: ...</div>
            <div style="color: #10b981; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px;" id="fb-correct">Lá sen an toàn: ...</div>
            <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 20px;" id="fb-exp">Giải thích</div>
            <button class="btn btn-primary" onclick="closeFeedback()" style="background: #16a34a;">ĐÃ HIỂU!</button>
        </div>
    </div>

    <script>
const qs = [
    { q: "Tệp Gioi_thieu sau khi dùng lệnh Move (Di chuyển) từ thư mục A sang B thì tệp sẽ nằm ở đâu?", a: ["Chỉ nằm ở thư mục B", "Nằm ở cả A và B"], c: 0, exp: "Lệnh Move giống như em bưng sách từ bàn này sang bàn khác, chỗ cũ sẽ không còn sách nữa." },
    { q: "Tệp Hinh_anh sau khi dùng lệnh Copy (Sao chép) từ thư mục A sang B thì tệp nằm ở đâu?", a: ["Nằm ở cả A và B", "Chỉ nằm ở thư mục B"], c: 0, exp: "Lệnh Copy tạo ra một bản sao y hệt, nên tệp sẽ tồn tại ở cả hai nơi." },
    { q: "Thư mục 'Lop 4A' chứa thư mục 'Nhom 1'. Vậy 'Nhom 1' được gọi là gì?", a: ["Thư mục con", "Thư mục mẹ"], c: 0, exp: "Thư mục nằm bên trong thư mục khác được gọi là Thư mục con." },
    { q: "Nếu xoá thư mục 'Nhom 1' thì các tệp bài tập bên trong nó sẽ ra sao?", a: ["Bị xoá theo tất cả", "Vẫn còn nguyên vẹn"], c: 0, exp: "Khi xoá thư mục, tất cả những gì chứa bên trong nó cũng sẽ bị ném vào thùng rác." },
    { q: "Trong tổ chức cây thư mục, thư mục nào chứa tất cả các thư mục khác?", a: ["Thư mục gốc (Ổ đĩa)", "Thư mục con"], c: 0, exp: "Ổ đĩa (ví dụ ổ C:, ổ D:) chính là thư mục gốc to nhất, chứa toàn bộ dữ liệu." },
    { q: "Khi di chuyển thư mục, các tệp bên trong có di chuyển theo không?", a: ["Có di chuyển theo", "Không di chuyển"], c: 0, exp: "Cả nhà sẽ cùng dọn đi! Khi chuyển thư mục, mọi tệp bên trong đều đi theo sang nơi mới." },
    { q: "Bạn An muốn đổi tên tệp 'bai_tap' thành 'Tin_hoc'. Bạn dùng lệnh gì?", a: ["Rename", "Delete"], c: 0, exp: "Rename có nghĩa là đặt lại tên. Delete là xoá mất rồi!" },
    { q: "Bạn Khoa xoá tệp trong thư mục Windows. Điều gì sẽ xảy ra?", a: ["Lỗi chương trình máy tính", "Máy chạy nhanh hơn"], c: 0, exp: "Thư mục Windows chứa bộ não của máy. Xoá nhầm sẽ làm máy tính ngừng hoạt động." },
    { q: "Khi chọn lệnh Paste (Dán) mà chưa dùng lệnh Copy trước đó thì sao?", a: ["Không dán được gì cả", "Tạo ra một tệp trống"], c: 0, exp: "Em phải 'Sao chép' (Copy) thì máy mới biết em muốn 'Dán' (Paste) cái gì chứ!" },
    { q: "Thư mục có thể chứa thư mục khác không?", a: ["Có, chứa được nhiều", "Không, chỉ chứa tệp"], c: 0, exp: "Thư mục có thể chứa rất nhiều tệp và cả các thư mục con khác ở bên trong nó." }
];        
        let playQueue=[], score=0, currRow=0, scrollOffset=0, onFeedbackClose = null, isAnimating=false;
        let frog, river;

        function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        
        function initGame(){ 
            playQueue=[...qs].sort(()=>Math.random()-0.5); score=0; currRow=0; scrollOffset=0;
            river = document.getElementById('river');
            buildRiver();
            showScreen('screen-game'); 
            loadQ(); 
        }

        function buildRiver() {
            river.innerHTML = ''; river.style.transform = `translateY(0px)`;
            
            for(let i = playQueue.length - 1; i >= 0; i--) {
                let row = document.createElement('div');
                row.className = 'row-pads';
                row.id = `row-${i}`;
                for(let j = 0; j < 2; j++) {
                    let pad = document.createElement('div');
                    pad.className = 'lily-pad disabled';
                    pad.innerText = ''; 
                    row.appendChild(pad);
                }
                river.appendChild(row);
            }

            let bank = document.createElement('div');
            bank.style.height = '100px'; bank.style.position = 'relative';
            river.appendChild(bank); 
            
            // Gắn ếch trực tiếp vào dòng sông, set toạ độ tuyệt đối
            frog = document.createElement('div');
            frog.className = 'frog'; frog.innerText = '🐸';
            river.appendChild(frog);
            
            // Đặt ếch ở trên vách đất (bank) ở dưới cùng
            frog.style.left = `calc(50% - 35px)`;
            frog.style.top = `${playQueue.length * 160 + 20}px`; 
        }
        
        function loadQ(){
            if(currRow >= playQueue.length) return endGame();
            isAnimating = false;
            
            document.getElementById('ui-q').innerText=playQueue[currRow].q; 
            document.getElementById('ui-prog').innerText=`${currRow+1}/${playQueue.length}`; 
            document.getElementById('ui-score').innerText=score; 
            
            document.querySelectorAll('.lily-pad').forEach(p => p.classList.add('disabled'));
            let currentRowEl = document.getElementById(`row-${currRow}`);
            let currentPads = currentRowEl.querySelectorAll('.lily-pad');
            
            let mix = playQueue[currRow].a.map((txt,idx)=>({txt, isC: idx===playQueue[currRow].c})).sort(()=>Math.random()-0.5);
            
            currentPads.forEach((pad, index) => {
                pad.classList.remove('disabled');
                pad.innerText = mix[index].txt;
                pad.onclick = () => checkAns(mix[index].isC, pad, mix[index].txt, mix);
            });
        }

        function checkAns(isC, pad, userAnsTxt, mix){
            if(isAnimating) return;
            isAnimating = true;
            
            // FIX TỌA ĐỘ ẾCH: Không dùng translate cộng dồn nữa, mà lấy đúng pixel tuyệt đối trên dòng sông!
            let padRect = pad.getBoundingClientRect();
            let riverRect = river.getBoundingClientRect();
            let newLeft = padRect.left - riverRect.left + (padRect.width / 2) - 35;
            let newTop = padRect.top - riverRect.top + (padRect.height / 2) - 40; 
            
            frog.style.left = `${newLeft}px`;
            frog.style.top = `${newTop}px`;
            
            // Thêm hiệu ứng nhảy (phóng to) nhẹ
            frog.style.transform = 'scale(1.2)';
            setTimeout(() => { frog.style.transform = 'scale(1)'; }, 200);

            setTimeout(() => {
                if(isC){ 
                    score+=100; document.getElementById('ui-score').innerText=score; 
                    scrollOffset += 160;
                    river.style.transform = `translateY(${scrollOffset}px)`;
                    
                    currRow++;
                    setTimeout(loadQ, 600);
                } else { 
                    frog.classList.add('splash-anim'); 
                    let cTxt = mix.find(m => m.isC).txt; 
                    setTimeout(() => {
                        showModal(userAnsTxt, cTxt, playQueue[currRow].exp, () => { 
                            frog.classList.remove('splash-anim');
                            scrollOffset += 160;
                            river.style.transform = `translateY(${scrollOffset}px)`;
                            currRow++; 
                            setTimeout(loadQ, 600);
                        });
                    }, 500);
                }
            }, 400);
        }

        function showModal(userAns, correctAns, exp, callback) {
            document.getElementById('fb-wrong').innerText = "Em chọn: " + userAns; 
            document.getElementById('fb-correct').innerText = "Đúng ra là: " + correctAns;
            document.getElementById('fb-exp').innerText = "💡 Chú ý: " + exp; 
            document.getElementById('fb-modal').classList.add('active'); 
            onFeedbackClose = callback;
        }

        function closeFeedback() { document.getElementById('fb-modal').classList.remove('active'); if(onFeedbackClose) onFeedbackClose(); }

        function endGame(){ document.getElementById('res-score').innerText=score; showScreen('screen-result'); }

        function saveAndGoHome() { 
            let data = localStorage.getItem('edtech_user_kid');
            if (!data) { window.location.href = 'index.html'; return; }
            let user = JSON.parse(data);
            if (!user.name) { window.location.href = 'index.html'; return; }

            user.xp = (user.xp || 0) + score; 
            user.level = Math.floor(user.xp / 500) + 1; 
            user.last_played = new Date().toLocaleString('vi-VN');
            
            localStorage.setItem('edtech_user_kid', JSON.stringify(user)); 
            
            let leaderboard = JSON.parse(localStorage.getItem('edtech_leaderboard')) || [];
            let existingStudent = leaderboard.findIndex(s => s.id === user.id);
            if(existingStudent !== -1) { leaderboard[existingStudent] = user; } 
            else { leaderboard.push(user); }
            localStorage.setItem('edtech_leaderboard', JSON.stringify(leaderboard));

            window.location.href = 'index.html#home'; 
        }
    </script>
</body>
</html>
