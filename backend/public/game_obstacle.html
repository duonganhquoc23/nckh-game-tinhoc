<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đường Đua Vui Nhộn</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #f0fdf4; --primary: #22c55e; --primary-dark: #166534; --accent: #ef4444; --warning: #f59e0b; --success: #10b981; --sky: #bae6fd; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Nunito', sans-serif; }
        body { background-color: var(--bg-main); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; padding: 20px;}
        .container { width: 100%; max-width: 900px; height: 100vh; max-height: 680px; background: #ffffff; border: 4px solid var(--primary); box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-radius: 30px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .screen { display: none; width: 100%; height: 100%; padding: 30px; flex-direction: column; align-items: center; justify-content: center;} .screen.active { display: flex !important; animation: fadeIn 0.4s ease; }
        .title-kid { font-family: 'Baloo 2', cursive; font-size: 3.5rem; color: var(--primary-dark); text-align: center; text-shadow: 2px 2px 0 #bbf7d0; margin-bottom: 15px;}
        .btn { background: var(--warning); color: white; padding: 15px 35px; font-size: 1.2rem; font-weight: 800; border-radius: 25px; cursor: pointer; transition: 0.2s; border: none; font-family: 'Baloo 2', cursive; box-shadow: 0 6px 0 #d97706; margin: 10px;}
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #d97706; }
        .btn-outline { background: #f1f5f9; border: 3px solid #cbd5e1; color: #475569; box-shadow: 0 5px 0 #cbd5e1; }
        
        #game-screen { padding: 0; justify-content: flex-start;}
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #f0fdf4; border-bottom: 3px dashed #bbf7d0; font-family: 'Baloo 2', cursive; font-size: 1.4rem; color: var(--primary-dark); z-index: 20; width: 100%;}
        .game-world { height: 320px; width: 100%; flex-shrink: 0; position: relative; background: linear-gradient(180deg, #7dd3fc 0%, #e0f2fe 100%); overflow: hidden; border-bottom: 6px solid var(--primary-dark);}
        .ground-grass { position: absolute; bottom: 0; left: 0; width: 100%; height: 35px; background: #22c55e; border-top: 6px solid #16a34a; z-index: 1; }
        .clouds { position: absolute; top: 20px; left: 0; width: 200%; font-size: 3.5rem; letter-spacing: 120px; animation: moveBg 25s linear infinite; white-space: nowrap;} .clouds::after { content: '☁️ ☁️ ☁️ ☁️ ☁️ ☁️'; }
        .trees { position: absolute; bottom: 30px; left: 0; width: 200%; font-size: 3rem; letter-spacing: 80px; animation: moveBg 15s linear infinite; white-space: nowrap;} .trees::after { content: '🌲 🌳 🌲 🌳 🌲 🌳 🌲'; }
        
        @keyframes moveBg { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .runner-sprite { display: inline-block; transform: scaleX(-1); }
        #player { position: absolute; left: 15%; bottom: 30px; font-size: 4.5rem; z-index: 10; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); transform-origin: bottom center;}
        .run-anim { animation: runBounce 0.3s alternate infinite; } @keyframes runBounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
        .jump-active { animation: jumpArc 0.8s forwards !important; } @keyframes jumpArc { 0% { transform: translateY(0); } 30% { transform: translateY(-200px); } 100% { transform: translateY(0); } }
        .bump-active { animation: bumpAnim 0.5s forwards !important; } @keyframes bumpAnim { 0%, 100% { transform: translateX(0);} 50% { transform: translateX(30px); filter: drop-shadow(0 0 15px red); } }
        .crash-active { animation: crashAnim 0.8s forwards !important; } @keyframes crashAnim { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(-40px, 30px) rotate(-90deg); filter: grayscale(1); opacity: 0;} }
        #obstacle-container { position: absolute; left: 55%; bottom: 30px; display: flex; flex-direction: column-reverse; align-items: center; z-index: 5; gap: 2px;}
        .box { width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; font-size: 3rem; } .box::after { content: '📦'; }
        .slide-active { animation: slideLeft 0.8s linear forwards; } @keyframes slideLeft { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(-550px); opacity: 0; } }
        
        .question-panel { background: #fff; padding: 20px; display: flex; flex-direction: column; flex: 1; z-index: 20;}
        .q-text { font-size: 1.3rem; font-weight: 800; margin-bottom: 15px; text-align: center; color: var(--primary-dark); font-family: 'Baloo 2', cursive;}
        .ans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex: 1; }
        .ans-btn { background: #f8fafc; border: 3px solid #cbd5e1; color: #334155; border-radius: 15px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; padding: 15px;}
        .ans-btn.correct { background: #d1fae5; border-color: var(--success); color: var(--success); } .ans-btn.wrong { background: #fee2e2; border-color: var(--accent); color: var(--accent); }
        .disabled-grid { pointer-events: none; opacity: 0.8; }
        
        .feedback-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .feedback-modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .feedback-box { background: #fff; padding: 30px; border-radius: 25px; text-align: center; max-width: 450px; width: 90%; border: 5px solid #ef4444; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div id="home-screen" class="screen active">
            <h1 class="title-kid">ĐƯỜNG ĐUA VUI NHỘN</h1>
            <p style="font-size: 1.2rem; font-weight: 700; color: #475569; margin-bottom: 20px; text-align: center; line-height: 1.6;">🏃‍♂️ Trả lời <b>ĐÚNG</b> để nhảy vọt qua chướng ngại vật.<br>📦 Trả lời <b>SAI</b>, thùng gỗ sẽ bị xếp cao thêm.</p>
            <div><button class="btn" onclick="initGame()">BẮT ĐẦU CHẠY</button><button class="btn btn-outline" onclick="window.location.href='index.html#games'">VỀ BẢN ĐỒ</button></div>
        </div>

        <div id="game-screen" class="screen">
            <div style="width: 100%; text-align: left; padding: 10px 25px; background: #f0fdf4; border-bottom: 2px solid #bbf7d0;"><button class="btn btn-outline" style="padding: 5px 15px; font-size: 1rem; border-width: 2px; margin: 0; background: white;" onclick="window.location.href='index.html#games'">← QUAY VỀ</button></div>
            <div class="hud"><div>Chặng: <span id="hud-progress" style="color: var(--accent);">0/5</span></div><div>XP: <span id="hud-score" style="color: var(--warning);">0</span></div></div>
            <div class="game-world">
                <div class="clouds"></div><div class="trees"></div><div class="ground-grass"></div>
                <div id="player" class="run-anim"><span class="runner-sprite" id="runner-character">👦</span></div>
                <div id="obstacle-container"></div>
            </div>
            <div class="question-panel"><div class="q-text" id="q-text">Câu hỏi...</div><div class="ans-grid" id="ans-grid"></div></div>
        </div>

        <div id="result-screen" class="screen">
            <h1 class="title-kid" id="res-title">HOÀN THÀNH!</h1>
            <div style="font-size: 1.5rem; font-weight: 800; margin-bottom: 30px;">Thu thập được: <span id="res-score" style="color: var(--warning); font-size: 2.5rem; font-family: 'Baloo 2', cursive;">0</span> XP</div>
            <div><button class="btn" style="background:var(--primary);" onclick="initGame()">CHẠY LẠI</button><button class="btn btn-outline" onclick="saveAndGoHome()">THOÁT</button></div>
        </div>
    </div>

    <div class="feedback-modal" id="fb-modal">
        <div class="feedback-box">
            <h2 style="font-family: 'Baloo 2', cursive; font-size: 2rem; color: #ef4444; margin-bottom: 10px;">Vấp ngã rồi! 📦</h2>
            <div style="color: #ef4444; font-size: 1.2rem; font-weight: bold; text-decoration: line-through; margin-bottom: 5px;" id="fb-wrong">Em chọn: ...</div>
            <div style="color: #10b981; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px;" id="fb-correct">Đúng là: ...</div>
            <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; line-height: 1.5;" id="fb-exp">Giải thích</div>
            <button class="btn btn-primary" onclick="closeFeedback()">ĐÃ HIỂU!</button>
        </div>
    </div>

    <script>
const qs = [
    { q: "Em muốn tìm hiểu về các đời vua Hùng. Từ khoá nào chuẩn nhất?", a: ["Các đời vua Hùng", "Vua", "Truyện cổ tích", "Lịch sử"], c: 0, exp: "Từ khoá 'Các đời vua Hùng' đầy đủ và chính xác nhất với yêu cầu tìm kiếm." },
    { q: "Muốn xem hình ảnh Hồ Gươm ở Hà Nội, chọn từ khoá nào?", a: ["Hồ Gươm", "Hồ nước đẹp", "Thủ đô", "Đi chơi"], c: 0, exp: "Gõ đúng tên địa danh 'Hồ Gươm' sẽ giúp máy tìm kiếm đưa ra ảnh chính xác nhất." },
    { q: "Từ khoá để tìm 'Vai trò của không khí đối với con người'?", a: ["Vai trò của không khí", "Con người", "Gió và mây", "Môi trường"], c: 0, exp: "Phải có chữ 'Vai trò của không khí' thì máy mới hiểu em muốn hỏi về tác dụng của nó." },
    { q: "Bạn Khoa muốn tìm địa chỉ Bảo tàng Dân tộc học Việt Nam?", a: ["Bảo tàng Dân tộc học Việt Nam", "Bảo tàng", "Dân tộc", "Địa chỉ ở đâu"], c: 0, exp: "Nên gõ tên đầy đủ của bảo tàng để Google chỉ đường chính xác, không nhầm sang bảo tàng khác." },
    { q: "Để tra nghĩa của từ 'Thư mục' tiếng Anh là gì?", a: ["Thư mục tiếng Anh là gì", "Tiếng Anh", "Thư mục", "Tra từ điển"], c: 0, exp: "Đặt câu hỏi trực tiếp làm từ khoá cũng là một cách rất hay khi dùng Google." },
    { q: "Từ khoá nào sau đây quá DÀI và KHÔNG cần thiết?", a: ["Cho tôi hỏi thời tiết ngày mai thế nào", "Thời tiết ngày mai", "Dự báo thời tiết", "Thời tiết Hà Nội"], c: 0, exp: "Không cần phải gõ 'Cho tôi hỏi...', chỉ cần gõ từ khoá chính như 'Thời tiết ngày mai' là đủ." },
    { q: "Muốn học cách gấp con ếch bằng giấy, em tìm bằng từ khoá nào?", a: ["Cách gấp con ếch bằng giấy", "Con ếch", "Giấy màu", "Trò chơi"], c: 0, exp: "Gõ rõ ràng 'Cách gấp con ếch bằng giấy' sẽ ra rất nhiều video hướng dẫn chi tiết." },
    { q: "Từ khoá 'Cách làm bánh chưng' sẽ trả về kết quả gì?", a: ["Hướng dẫn gói bánh chưng", "Lịch sử ngày Tết", "Mua bánh chưng", "Truyện Sự tích bánh chưng"], c: 0, exp: "Từ khoá chứa chữ 'Cách làm' nên Google sẽ ưu tiên các bài viết hướng dẫn nấu ăn." },
    { q: "Muốn tìm thông tin về nhà toán học Lương Thế Vinh?", a: ["Lương Thế Vinh", "Nhà toán học", "Sách toán lớp 4", "Học giỏi toán"], c: 0, exp: "Tên riêng 'Lương Thế Vinh' chính là từ khoá quan trọng nhất." },
    { q: "Từ khoá nào sau đây quá NGẮN, dễ ra sai kết quả?", a: ["Biển", "Bãi biển Mỹ Khê Đà Nẵng", "Cảnh đẹp biển Nha Trang", "Tắm biển Vũng Tàu"], c: 0, exp: "Chỉ gõ chữ 'Biển' thì máy tính sẽ không biết em muốn tìm biển ở đâu, biển nào." }
];        
        let state = {score: 0, clearedObs: 0, questionPool: [], boxCount: 1}, onFeedbackClose = null;
        window.addEventListener('DOMContentLoaded', () => { document.getElementById('runner-character').innerText = (JSON.parse(localStorage.getItem('edtech_user_kid')) || {}).avatar || '👦'; });

        function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        
        function initGame(){ state.score = 0; state.clearedObs = 0; state.boxCount = 1; state.questionPool = [...qs].sort(() => Math.random() - 0.5); updateHUD(); renderBoxes(); showScreen('game-screen'); document.getElementById('player').className = 'run-anim'; setTimeout(askQuestion, 500); }
        function updateHUD(){ document.getElementById('hud-progress').innerText = `${state.clearedObs}/5`; document.getElementById('hud-score').innerText = state.score; }
        function renderBoxes(){ const container = document.getElementById('obstacle-container'); container.innerHTML = ''; container.classList.remove('slide-active'); for(let i=0; i < state.boxCount; i++) { let box = document.createElement('div'); box.className = 'box'; container.appendChild(box); } }
        
        function askQuestion(){
            if(state.questionPool.length === 0) state.questionPool = [...qs].sort(() => Math.random() - 0.5);
            currentQ = state.questionPool.pop(); document.getElementById('q-text').innerText = currentQ.q;
            const grid = document.getElementById('ans-grid'); grid.innerHTML = ''; grid.classList.remove('disabled-grid');
            let ansMix = currentQ.a.map((txt, idx) => ({txt, isC: idx === currentQ.c})).sort(() => Math.random() - 0.5);
            ansMix.forEach(ans => { const btn = document.createElement('button'); btn.className = 'ans-btn'; btn.innerText = ans.txt; btn.onclick = () => submitAnswer(ans.isC, btn, ansMix); grid.appendChild(btn); });
        }
        
        function submitAnswer(isCorrect, btn, ansMix){
            document.getElementById('ans-grid').classList.add('disabled-grid');
            if(isCorrect){ btn.classList.add('correct'); handleCorrect(); } 
            else { 
                btn.classList.add('wrong'); const correctAns = ansMix.find(a => a.isC).txt;
                document.querySelectorAll('.ans-btn')[ansMix.findIndex(a => a.isC)].classList.add('correct'); 
                showModal(btn.innerText, correctAns, currentQ.exp, () => handleWrong());
            }
        }
        
        function showModal(userAns, correctAns, exp, callback) {
            document.getElementById('fb-wrong').innerText = "Em đã chọn: " + userAns; document.getElementById('fb-correct').innerText = "Đáp án đúng: " + correctAns;
            document.getElementById('fb-exp').innerText = "💡 Chú ý: " + exp; document.getElementById('fb-modal').classList.add('active'); onFeedbackClose = callback;
        }
        function closeFeedback() { document.getElementById('fb-modal').classList.remove('active'); if(onFeedbackClose) onFeedbackClose(); }

        function handleCorrect(){
            const player = document.getElementById('player'), obsContainer = document.getElementById('obstacle-container');
            player.classList.remove('run-anim'); player.classList.add('jump-active'); obsContainer.classList.add('slide-active');
            setTimeout(() => { 
                player.classList.remove('jump-active'); player.classList.add('run-anim'); obsContainer.classList.remove('slide-active'); 
                state.score += 100; state.clearedObs++; updateHUD(); 
                if (state.clearedObs >= 5) endGameScreen(true); else { state.boxCount = 1; renderBoxes(); askQuestion(); } 
            }, 800);
        }
        
        function handleWrong(){
            const player = document.getElementById('player'); state.boxCount++; 
            if(state.boxCount > 3) { player.classList.remove('run-anim'); player.classList.add('crash-active'); setTimeout(() => endGameScreen(false), 800); } 
            else { player.classList.add('bump-active'); renderBoxes(); setTimeout(() => { player.classList.remove('bump-active'); askQuestion(); }, 600); }
        }
        
        function endGameScreen(isWin){
            const title = document.getElementById('res-title');
            if(isWin){ title.innerText = "VỀ ĐÍCH THÀNH CÔNG!"; title.style.color = "var(--success)"; } 
            else { title.innerText = "VẤP NGÃ RỒI 😢"; title.style.color = "var(--accent)"; }
            document.getElementById('res-score').innerText = state.score; showScreen('result-screen');
        }
        
        function saveAndGoHome() { 
            let user = JSON.parse(localStorage.getItem('edtech_user_kid')) || {}; 
            let currentScore = 0;
            if (typeof score !== 'undefined') currentScore = score; 
            else if (typeof state !== 'undefined' && typeof state.score !== 'undefined') currentScore = state.score; 
            if (typeof bossHP !== 'undefined') currentScore = (bossHP <= 0) ? 250 : 50;

            user.xp = (user.xp || 0) + currentScore; 
            user.level = Math.floor(user.xp / 500) + 1; 
            user.last_played = new Date().toLocaleString('vi-VN');
            
            localStorage.setItem('edtech_user_kid', JSON.stringify(user)); 
            
            let leaderboard = JSON.parse(localStorage.getItem('edtech_leaderboard')) || [];
            let existingStudent = leaderboard.findIndex(s => s.id === user.id);
            if(existingStudent !== -1) { leaderboard[existingStudent] = user; } 
            else { leaderboard.push(user); }
            localStorage.setItem('edtech_leaderboard', JSON.stringify(leaderboard));

            window.location.href = 'index.html#games'; 
        }
   </script>
</body>
</html>
