<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống - Game Tin Học</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f8fafc; font-family: 'Nunito', sans-serif; padding: 20px; color: #334155; }
        .admin-container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; }
        .admin-header h2 { color: #4f46e5; font-weight: 800; font-size: 1.8rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: #f0fdfa; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #ccfbf1; }
        .stat-box h3 { color: #0d9488; margin-bottom: 5px; font-size: 1.1rem; }
        .stat-box span { font-size: 2.2rem; font-weight: 800; color: #0f766e; }
        
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
        select { padding: 10px 20px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 1rem; font-family: 'Nunito', sans-serif; cursor: pointer; outline: none; }
        
        .btn-admin { padding: 10px 20px; border-radius: 10px; border: none; font-size: 1rem; font-family: 'Nunito', sans-serif; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; display: inline-flex; align-items: center; gap: 8px; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; font-weight: 800; }
        tr:hover { background-color: #f8fafc; }
        
        .btn-action-del { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-action-del:hover { background: #fca5a5; }
        .btn-action-view { background: #e0e7ff; color: #4f46e5; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-right: 5px; }
        .btn-action-view:hover { background: #c7d2fe; }
        .badge { background: #e0e7ff; color: #4338ca; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        
        /* CSS cho Modal Lịch sử */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 85%; max-width: 900px; max-height: 80vh; border-radius: 20px; padding: 25px; overflow-y: auto; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .btn-close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.5rem; color: #ef4444; cursor: pointer; transition: 0.2s; }
        .btn-close-modal:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h2><i class="fa-solid fa-shield-halved"></i> TRUNG TÂM CHỈ HUY TIN HỌC</h2>
            <button class="btn-admin btn-success" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Xuất file Excel</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3><i class="fa-solid fa-users"></i> Tổng số học sinh</h3>
                <span id="stat-total-students">0</span>
            </div>
            <div class="stat-box">
                <h3><i class="fa-solid fa-star"></i> Tổng điểm thu thập</h3>
                <span id="stat-total-xp">0</span>
            </div>
            <div class="stat-box">
                <h3><i class="fa-solid fa-bolt"></i> Điểm trung bình</h3>
                <span id="stat-avg-xp">0</span>
            </div>
        </div>

        <div class="controls">
            <select id="class-filter" onchange="applyFilter()">
                <option value="">-- Tất cả các lớp --</option>
            </select>
            <button class="btn-admin btn-danger" onclick="deleteFiltered()"><i class="fa-solid fa-trash-can"></i> Xóa dữ liệu danh sách này</button>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">STT</th>
                        <th>Học sinh & Lớp</th>
                        <th style="text-align: center;">Avatar</th>
                        <th>Tổng XP</th>
                        <th>Cấp độ</th>
                        <th>Hoạt động gần nhất</th>
                        <th style="text-align: center; min-width: 160px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="tb-students">
                    <!-- Dữ liệu JS sẽ tự động đổ vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Xem Lịch Sử -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="btn-close-modal" onclick="closeHistoryModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="color: #4f46e5; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;">
                <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử làm bài: <span id="history-student-name" style="color: #0f766e;"></span>
            </h2>
            <div style="overflow-x: auto; margin-top: 15px;">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 150px;">Thời gian</th>
                            <th style="width: 150px;">Trò chơi</th>
                            <th>Câu hỏi</th>
                            <th>Đáp án đã chọn</th>
                            <th style="width: 100px;">Kết quả</th>
                        </tr>
                    </thead>
                    <tbody id="tb-history">
                        <!-- Dữ liệu lịch sử đổ vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="/admin/admin.js"></script>
</body>
</html>
