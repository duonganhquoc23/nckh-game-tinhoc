<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thành Phố Thiết Bị - Bắn Súng</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #e0f2fe; --primary: #0284c7; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --city-bg: #0f172a;}
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Nunito', sans-serif;}
        body { background-color: var(--bg-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
        
        .game-container { width: 100%; max-width: 900px; background: #ffffff; border: 4px solid var(--primary); border-radius: 30px; position: relative; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; flex-direction: column; cursor: crosshair;}
        .screen { display: none; padding: 40px; text-align: center; } .screen.active { display: block; animation: fadeIn 0.4s ease; }
        .title-kid { font-family: 'Baloo 2', cursive; font-size: 3.5rem; color: var(--primary); margin-bottom: 10px; text-shadow: 2px 2px 0 #bae6fd;}
        
        .btn { padding: 15px 35px; background: var(--warning); color: white; font-size: 1.2rem; font-weight: 800; border-radius: 25px; cursor: pointer; box-shadow: 0 6px 0 #d97706; margin: 10px; border: none; font-family: 'Baloo 2', cursive;}
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
        .btn-outline { background: #f1f5f9; border: 3px solid #cbd5e1; color: #475569; box-shadow: 0 5px 0 #cbd5e1; }
        
        .hud { display: flex; justify-content: space-between; background: #f0f9ff; padding: 15px 30px; font-size: 1.4rem; font-weight: 800; color: var(--primary); border-bottom: 4px dashed #bae6fd; font-family: 'Baloo 2', cursive; z-index: 50; position: relative;}
        .q-box { background: #fff; padding: 20px; font-size: 1.4rem; font-weight: 800; color: #334155; border-bottom: 4px solid var(--primary); z-index: 50; min-height: 90px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.1);}
        
        .viewport { height: 450px; position: relative; background: var(--city-bg); overflow: hidden; }
        .city-skyline { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: url('https://www.transparenttextures.com/patterns/stardust.png'); border-bottom: 50px solid #1e293b; z-index: 1;}
        .city-skyline::before { content: ''; position: absolute; bottom: 0; left: 10%; width: 60px; height: 120px; background: #334155; box-shadow: 100px 20px 0 40px #1e293b, 250px 40px 0 20px #0f172a, 400px -20px 0 60px #334155, 600px 30px 0 30px #1e293b, 750px 10px 0 50px #475569;}
        
        .target { position: absolute; background: #ffffff; border: 4px solid #38bdf8; border-radius: 20px; padding: 10px 20px; font-size: 1.2rem; font-weight: bold; color: #0284c7; cursor: crosshair; box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 -4px 0 #bae6fd; z-index: 10; display: flex; align-items: center; gap: 10px; transition: transform 0.1s; animation: floatTarget 6s linear infinite; }
        .target:hover { transform: scale(1.1); border-color: #f59e0b; color: #d97706;}
        
        .explode { animation: explosion 0.4s forwards; pointer-events: none; }
        @keyframes explosion {
            0% { transform: scale(1); filter: brightness(1); opacity: 1; }
            50% { transform: scale(1.5); filter: brightness(2) hue-rotate(90deg); opacity: 0.8; }
            100% { transform: scale(2) rotate(15deg); opacity: 0; }
        }

        @keyframes floatTarget {
            0% { transform: translate(-100px, 0); }
            50% { transform: translate(calc(450px), 30px); }
            100% { transform: translate(calc(900px + 100px), -20px); }
        }

        .feedback-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); cursor: default;}
        .feedback-modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .feedback-box { background: #fff; padding: 30px; border-radius: 25px; text-align: center; max-width: 450px; width: 90%; border: 5px solid #ef4444; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        @keyframes fadeIn { from { opacity:0; transform: translateY(15px); } to { opacity:1; transform: translateY(0); } } 
    </style>
</head>
<body>
    <div class="game-container">
        <div id="screen-home" class="screen active">
            <h1 class="title-kid">🎯 THÀNH PHỐ THIẾT BỊ</h1>
            <p style="font-size:1.3rem; margin-bottom:30px; font-weight:700;">Hãy ngắm thật chuẩn! Đọc kỹ câu hỏi và <b style="color:var(--error);">bắn trúng</b> thiết bị mang đáp án đúng đang bay trên bầu trời nhé!</p>
            <div>
                <button class="btn" onclick="initGame()"><i class="fa-solid fa-crosshairs"></i> BẮT ĐẦU CHIẾN ĐẤU</button>
                <button class="btn btn-outline" onclick="window.location.href='index.html#home'">VỀ BẢN ĐỒ</button>
            </div>
        </div>
        
        <div id="screen-game" class="screen" style="padding: 0;">
            <div style="width: 100%; text-align: left; padding: 10px 30px; background: #f0f9ff; border-bottom: 2px solid #bae6fd; z-index: 50; position: relative;"><button class="btn btn-outline" style="padding: 5px 15px; font-size: 1rem; border-width: 2px; margin: 0; background: white;" onclick="window.location.href='index.html#home'">← QUAY VỀ</button></div>
            <div class="hud">
                <div>Mục tiêu: <span id="ui-prog" style="color: var(--warning);">1/10</span></div>
                <div>XP: <span id="ui-score" style="color: var(--success);">0</span></div>
            </div>
            <div class="q-box" id="ui-q">Câu hỏi...</div>
            
            <div class="viewport" id="viewport">
                <div class="city-skyline"></div>
                <div id="targets-container"></div>
            </div>
        </div>
        
        <div id="screen-result" class="screen">
            <h1 class="title-kid" style="color: var(--success);">BẢO VỆ THÀNH CÔNG!</h1>
            <div style="font-size: 1.5rem; font-weight: 800; margin-bottom: 30px;">Thu thập được: <span id="res-score" style="color: var(--warning); font-size: 2.5rem; font-family: 'Baloo 2', cursive;">0</span> XP</div>
            <div>
                <button class="btn" style="background:var(--primary);" onclick="initGame()">CHƠI LẠI</button>
                <button class="btn btn-outline" onclick="saveAndGoHome()">THOÁT</button>
            </div>
        </div>
    </div>

    <div class="feedback-modal" id="fb-modal">
        <div class="feedback-box">
            <h2 style="font-family: 'Baloo 2', cursive; font-size: 2rem; color: #ef4444; margin-bottom: 10px;">Bắn trượt rồi! 💥</h2>
            <div style="color: #ef4444; font-size: 1.2rem; font-weight: bold; text-decoration: line-through; margin-bottom: 5px;" id="fb-wrong">Em đã bắn: ...</div>
            <div style="color: #10b981; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px;" id="fb-correct">Mục tiêu đúng: ...</div>
            <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 20px;" id="fb-exp">Giải thích</div>
            <button class="btn btn-primary" onclick="closeFeedback()" style="background: #16a34a;">NẠP ĐẠN, THỬ LẠI!</button>
        </div>
    </div>

    <script>
    const API_BASE_URL = 'https://nckh-game-tinhoc.onrender.com';
        
    // HÀM LƯU LỊCH SỬ VÀO DATABASE
    async function saveHistory(gameName, question, studentAnswer, isCorrect) {
        let data = localStorage.getItem('edtech_user_kid');
        if (!data) return;
        let user = JSON.parse(data);
        if (!user.name) return;
        try {
            await fetch(`${API_BASE_URL}/api/history`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_name: user.name,
                    game_name: gameName,
                    question: question,
                    student_answer: studentAnswer,
                    is_correct: isCorrect
                })
            });
        } catch (error) { console.error('Lỗi lưu lịch sử:', error); }
    }

    const qs = [
        { q: "Thiết bị nào dùng để nhập chữ và số vào máy tính?", a: ["Bàn phím", "Màn hình", "Máy in", "Loa"], c: 0, exp: "Bàn phím (Keyboard) là thiết bị nhập dữ liệu chính, gồm nhiều phím chữ và số." },
        { q: "Thiết bị nào hiển thị hình ảnh và kết quả làm việc cho em xem?", a: ["Màn hình", "Chuột", "Thân máy", "Micro"], c: 0, exp: "Màn hình (Monitor) là thiết bị xuất, giúp hiển thị hình ảnh từ máy tính." },
        { q: "Bộ phận nào được ví như 'Bộ脑' của máy tính để bàn?", a: ["Thân máy (CPU)", "Chuột", "Bàn phím", "Loa"], c: 0, exp: "Thân máy tính chứa CPU (Bộ vi xử lý trung tâm), đảm nhận việc xử lý mọi thông tin." },
        { q: "Thiết bị nào giúp em điều khiển con trỏ trên màn hình dễ dàng?", a: ["Chuột máy tính", "Máy in", "Thân máy", "Bàn phím"], c: 0, exp: "Chuột (Mouse) giúp em nhấp, chọn và di chuyển con trỏ trên màn hình rất nhanh." },
        { q: "Thiết bị nào giúp máy tính phát ra âm thanh, bài hát?", a: ["Loa / Tai nghe", "Màn hình", "Máy quét", "Micro"], c: 0, exp: "Loa hoặc Tai nghe là thiết bị xuất âm thanh, giúp em nghe được nhạc và tiếng động." },
        { q: "Để thu giọng nói của em vào máy tính, em cần dùng thiết bị gì?", a: ["Micro", "Loa", "Màn hình", "Máy in"], c: 0, exp: "Micro (Microphone) là thiết bị dùng để thu âm thanh vào trong máy tính." },
        { q: "Thiết bị nào giúp in tài liệu từ máy tính ra giấy?", a: ["Máy in", "Máy quét", "Màn hình", "Bàn phím"], c: 0, exp: "Máy in (Printer) sẽ nhận dữ liệu từ máy tính và in hình ảnh/chữ lên giấy." },
        { q: "Bàn phím, Chuột và Micro được xếp vào nhóm thiết bị gì?", a: ["Thiết bị nhập", "Thiết bị xuất", "Thiết bị lưu trữ", "Thiết bị xử lý"], c: 0, exp: "Thiết bị nhập (Input) là những thiết bị giúp đưa thông tin TỪ BÊN NGOÀI VÀO máy tính." },
        { q: "Màn hình, Loa và Máy in được xếp vào nhóm thiết bị gì?", a: ["Thiết bị xuất", "Thiết bị nhập", "Bộ nhớ trong", "Bộ nhớ ngoài"], c: 0, exp: "Thiết bị xuất (Output) là những thiết bị đưa kết quả TỪ MÁY TÍNH RA ngoài." },
        { q: "Thiết bị nào giúp lưu trữ dữ liệu để mang đi nơi khác dễ dàng?", a: ["USB", "Màn hình", "RAM", "CPU"], c: 0, exp: "USB là một thiết bị lưu trữ ngoài nhỏ gọn, rất tiện lợi để copy và mang dữ liệu đi." }
    ];        
        
        let playQueue=[], score=0, currRow=0, onFeedbackClose = null, isAnimating=false;
        let animationFrameIds = [];

        function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        
        function initGame(){ 
            playQueue=[...qs].sort(()=>Math.random()-0.5).slice(0, 10); 
            score=0; currRow=0;
            showScreen('screen-game'); 
            loadQ(); 
        }

        function loadQ(){
            if(currRow >= playQueue.length) return endGame();
            isAnimating = false;
            
            document.getElementById('ui-q').innerText=playQueue[currRow].q; 
            document.getElementById('ui-prog').innerText=`${currRow+1}/${playQueue.length}`; 
            document.getElementById('ui-score').innerText=score; 
            
            spawnTargets();
        }

        function spawnTargets() {
            const container = document.getElementById('targets-container');
            container.innerHTML = ''; 
            
            let mix = playQueue[currRow].a.map((txt,idx)=>({txt, isC: idx===playQueue[currRow].c})).sort(()=>Math.random()-0.5);
            
            mix.forEach((item, index) => {
                let target = document.createElement('div');
                target.className = 'target';
                
                const icons = ['fa-desktop', 'fa-keyboard', 'fa-mouse', 'fa-microchip', 'fa-print', 'fa-headphones'];
                let randomIcon = icons[Math.floor(Math.random() * icons.length)];
                target.innerHTML = `<i class="fa-solid ${randomIcon}"></i> ${item.txt}`;
                
                let startY = 20 + Math.random() * 250; 
                let animDuration = 6 + Math.random() * 4; 
                let animDelay = index * -1.5; 
                
                target.style.top = `${startY}px`;
                target.style.animationDuration = `${animDuration}s`;
                target.style.animationDelay = `${animDelay}s`;
                
                target.onmousedown = (e) => {
                    if (isAnimating) return;
                    shootTarget(item.isC, target, item.txt, mix);
                };
                
                container.appendChild(target);
            });
        }

        function shootTarget(isC, targetEl, userAnsTxt, mix){
            isAnimating = true;
            
            targetEl.style.animationPlayState = 'paused';
            targetEl.classList.add('explode');

            // GỌI HÀM LƯU LỊCH SỬ TẠI ĐÂY
            saveHistory("Thành Phố Thiết Bị", playQueue[currRow].q, userAnsTxt, isC);

            setTimeout(() => {
                if(isC){ 
                    score+=100; document.getElementById('ui-score').innerText=score; 
                    currRow++;
                    loadQ();
                } else { 
                    let cTxt = mix.find(m => m.isC).txt; 
                    showModal(userAnsTxt, cTxt, playQueue[currRow].exp, () => { 
                        currRow++; 
                        loadQ();
                    });
                }
            }, 400);
        }

        function showModal(userAns, correctAns, exp, callback) {
            document.getElementById('fb-wrong').innerText = "Em đã bắn trúng: " + userAns; 
            document.getElementById('fb-correct').innerText = "Đúng ra phải là: " + correctAns;
            document.getElementById('fb-exp').innerText = "💡 Chú ý: " + exp; 
            document.getElementById('fb-modal').classList.add('active'); 
            onFeedbackClose = callback;
        }

        function closeFeedback() { document.getElementById('fb-modal').classList.remove('active'); if(onFeedbackClose) onFeedbackClose(); }

        function endGame(){ 
            document.getElementById('targets-container').innerHTML = ''; 
            document.getElementById('res-score').innerText=score; 
            showScreen('screen-result'); 
        }

        function saveAndGoHome() { 
            let data = localStorage.getItem('edtech_user_kid');
            if (!data) { window.location.href = 'index.html'; return; }
            let user = JSON.parse(data);
            if (!user.name) { window.location.href = 'index.html'; return; }

            user.xp = (user.xp || 0) + score; 
            user.level = Math.floor(user.xp / 500) + 1; 
            user.last_played = new Date().toLocaleString('vi-VN');
            
            localStorage.setItem('edtech_user_kid', JSON.stringify(user)); 
            
            let leaderboard = JSON.parse(localStorage.getItem('edtech_leaderboard')) || [];
            let existingStudent = leaderboard.findIndex(s => s.id === user.id);
            if(existingStudent !== -1) { leaderboard[existingStudent] = user; } 
            else { leaderboard.push(user); }
            localStorage.setItem('edtech_leaderboard', JSON.stringify(leaderboard));

            if (typeof window.syncToAdmin === 'function') {
                window.syncToAdmin(user);
            }

            window.location.href = 'index.html#home'; 
        }
    </script>
</body>
</html>
